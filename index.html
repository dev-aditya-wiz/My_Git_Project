<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <h1>Instagram</h1>

        <div class="nav-icons">
            <button id="themeBtn">🌙</button>
            <button>❤️</button>
            <button>✉️</button>
        </div>
    </nav>

    <main>

        <section class="profile">
            <div class="profile-image">
                👤
            </div>

            <div class="profile-info">
                <h2>my_profile</h2>
                <p>My Instagram Project ✨</p>

                <div class="stats">
                    <span><b>12</b> posts</span>
                    <span><b>1.2K</b> followers</span>
                    <span><b>250</b> following</span>
                </div>

                <button class="follow-btn" id="followBtn">
                    Follow
                </button>
            </div>
        </section>

        <section class="stories">

            <div class="story">
                <div class="story-image">😊</div>
                <p>Your Story</p>
            </div>

            <div class="story">
                <div class="story-image">🌸</div>
                <p>Sarah</p>
            </div>

            <div class="story">
                <div class="story-image">🌊</div>
                <p>Alex</p>
            </div>

            <div class="story">
                <div class="story-image">🌄</div>
                <p>John</p>
            </div>

        </section>

        <section class="posts">

            <div class="post">
                <div class="post-image">🌅</div>

                <div class="post-actions">
                    <button class="likeBtn">♡</button>
                    <button>💬</button>
                    <button>✈️</button>
                    <button class="saveBtn">🔖</button>
                </div>

                <p class="likes">120 likes</p>
            </div>

            <div class="post">
                <div class="post-image">🌴</div>

                <div class="post-actions">
                    <button class="likeBtn">♡</button>
                    <button>💬</button>
                    <button>✈️</button>
                    <button class="saveBtn">🔖</button>
                </div>

                <p class="likes">98 likes</p>
            </div>

            <div class="post">
                <div class="post-image">🌃</div>

                <div class="post-actions">
                    <button class="likeBtn">♡</button>
                    <button>💬</button>
                    <button>✈️</button>
                    <button class="saveBtn">🔖</button>
                </div>

                <p class="likes">156 likes</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
